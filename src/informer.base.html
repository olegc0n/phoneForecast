/* ---------------- cat stage ---------------- */
/* z-index only: the forecast sits above the cat stage. There was a .dimmed
   class and an opacity transition here for quiet hours, but nothing ever
   applied them - quiet hours stop the animation, they do not dim. */
#wrapper {
	z-index: 2;
}
/* Scenery (sun, moon, window, parasol) belongs BEHIND the forecast text, or it
   covers the numbers. Foreground props (bowl, yarn, leaf) stay in front. */
#cat_stage_back {
	position: fixed;
	left: 0;
	top: 0;
	width: 100%;
	height: 100%;
	pointer-events: none;
	overflow: hidden;
	z-index: 1;
}
#cat_props_back {
	position: absolute;
	left: 0;
	top: 0;
	width: 100%;
	height: 100%;
}
#cat_props_back div {
	position: absolute;
	opacity: 0;
	transform-origin: 50% 50%;
	will-change: transform, opacity;
}
#cat_stage {
	/* fixed, not absolute: #wrapper is absolutely positioned, so <body> has no
	   height of its own and a percentage height here would collapse to zero. */
	position: fixed;
	left: 0;
	top: 0;
	width: 100%;
	height: 100%;
	pointer-events: none;
	overflow: hidden;
	z-index: 3;
}
#cat_holder {
	position: absolute;
	left: 0;
	top: 0;
	width: 44vw;
	height: 57.6vw;
	will-change: transform;
	/* top-left origin, so translate and scale compose predictably */
	transform-origin: 0 0;
	z-index: 5;
}
#cat_holder svg {
	width: 100%;
	height: 100%;
	overflow: visible;
}
#cat_props {
	position: absolute;
	left: 0;
	top: 0;
	width: 100%;
	height: 100%;
}
/* the forecast is hidden outright during an episode, not dimmed */
#wrapper.hidden {
	opacity: 0;
}
#cat_props div {
	position: absolute;

	transform-origin: 50% 50%;

	display: none;

	top: 0;

}

	position: absolute;

	position: relative;
	height: 53vw;
	overflow: hidden;
	margin-bottom: 4vw;
}

	position: absolute;
	top: -8.5vw;
	font-size: 42vw;
	left: 50%;
	transform: translate(-50%, 0);
	letter-spacing: -1vw;
}
#date {
	position: absolute;
	top: 32vw;
	width: 100%;
	font-size: 17vw;
	left: 50%;
	transform: translate(-50%, 0);
	white-space: nowrap;
}
#now {
	position: relative;
	height: 33vw;
}
/* ---------------- the sky (src/core/sky.js) ----------------
 * 54vw..107vw from the top of the page: 12vw above #now, 53vw tall, so #now
 * keeps its height and #forecast does not move. Everything inside is in vw,
 * and the svg's viewBox is 100 x 53, so one svg unit is one vw. */
#sky {
	position: absolute;
	left: 0;
	top: -12vw;
	width: 100%;
	height: 53vw;
}
/* a preview from the test menu with no forecast in hand still shows its sky */
#sky.sky_force {
	opacity: 1;
}
#sky_svg {
	position: absolute;
	left: 0;
	top: 0;
	width: 100%;
	height: 100%;
	overflow: visible;
	/* its own layer: the clouds and the sock move every frame, and without
	   this each move re-rasters the blurred text-shadow of the numbers */
	will-change: transform;
}
.shade {
	text-shadow: 0 0 1.2vw #000, 0 0 2.6vw #000;
}
#temperature::after, #forecast_temperature_0::after, #forecast_temperature_1::after {
	content: "\00B0";
}
/* left of the pole, the baseline just above the horizon (top + 0.842em = 42vw).
   23vw with the letters pulled together keeps a two-digit "+12°" on screen: it
   starts about 2vw from the left edge. */
#temperature {
	position: absolute;
	right: 54vw;
	top: 22.6vw;
	font-size: 23vw;
	letter-spacing: -0.9vw;
	line-height: 1;
	white-space: nowrap;
}
/* right of the pole: wind, humidity, pressure */
#sky_stats {
	position: absolute;
	left: 55vw;
	top: 25.6vw;
	text-align: left;
}
#sky_stats .st {
	display: flex;
	align-items: center;
	height: 5vw;
	margin-bottom: 0.6vw;          /* not `gap`: flex gap is Chrome 84, the WebView is 69 */
	white-space: nowrap;
}
#sky_stats .ic {
	flex: none;
	width: 4vw;
	height: 4vw;
	background-size: 4vw 4vw;
	background-repeat: no-repeat;
	background-position: center;
}
#sky_stats b {
	font-weight: normal;
	font-size: 4.6vw;
	padding-left: 0.8vw;
}
#sky_stats i {
	font-style: normal;
	font-size: 2.6vw;
	color: #c9ccc6;
	padding-left: 0.6vw;
	padding-top: 1.1vw;
}
/* sunrise and sunset on the ground at either end of the arc; at night they
   swap, so the left corner is always where the arc began */
.sky_corner {
	position: absolute;
	top: 44vw;
	display: flex;
	align-items: center;
}
.sky_corner.l {
	left: 1.5vw;
}
.sky_corner.r {
	right: 1.5vw;
	flex-direction: row-reverse;     /* the icon at the outer edge */
}
.sky_corner .ci {
	width: 5.6vw;
	height: 5.6vw;
	background-size: contain;
	background-repeat: no-repeat;
	background-position: center;
}
.sky_corner span {
	font-size: 4.4vw;
	line-height: 1.1;
	padding: 0 0.8vw;
}
#forecast {
	display: flex;
}

#forecast .wind_icon {
	background-repeat: no-repeat;
	height: 5vw;
    width: 5vw;
}
.forecast_part {
	width: 50%;
	padding-left: 5vw;
}
.forecast_icon {
    width: 45%;
	background-size: 18vw 18vw;
	background-repeat: no-repeat;
}
.forecast_temperature_wind {
	display: flex;
	font-size: 10vw;
}
.forecast_desc {
	display: flex;
}
.forecast_title {
	font-size: 6vw;
	padding-bottom: 1vw;
}
.forecast_title {
	text-transform: capitalize;
}
.forecast_temperature {
	text-align: left;
	font-size: 7vw;
}
.forecast_wind_block {
	display: flex;
	font-size: 3vw;
	align-items: center;
}
.forecast_wind {
	font-size: 5vw;
	padding-left: 1vw;
}
